<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>REPORT (with PDF export)</title>

<!-- jsPDF + AutoTable (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
  body{font-family:Arial, Helvetica, sans-serif;background:#fbf6f3;margin:0}
  .header{background:#7a2424;color:#fff;padding:18px 0;text-align:center;font-weight:800;font-size:36px;position:relative}
  .logo{position:absolute;right:18px;top:8px;width:64px;height:64px;border-radius:50%;background:#f9f1ef;display:flex;align-items:center;justify-content:center;color:#7a2424;font-weight:700;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .wrap{max-width:1100px;margin:24px auto;padding:28px;background:#fff;border-radius:10px;border:6px solid rgba(186,144,138,0.15);}

  .controls{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;          /* one line on desktop */
    gap:12px;
  }

  .pill{
    background:#d8d7d7;
    padding:10px 10px;
    border-radius:13px;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:140px;
    max-width:200px;
    box-shadow:0 6px rgba(0,0,0,0.08);
  }

  .pill label{
    font-weight:900;
    font-size:13px;
    white-space:nowrap;
  }

  .pill input[type="date"]{
    border:0;
    background:transparent;
    font-weight:700;
    font-size:12px;
    outline:none;
    width:105px;          /* keeps calendar inside */
    padding:0;
    margin:0;
  }

  .pill select{
    border:0;
    background:transparent;
    font-weight:700;
    font-size:12px;
    outline:none;
    min-width:70px;
  }

  input[type="date"]::-webkit-calendar-picker-indicator{
    cursor:pointer;
    margin-left:4px;
  }

  .submit{
    background:#0a570d;
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:900;
    font-size:13px;
    box-shadow:0 6px rgba(0,0,0,0.18);
  }

  .download{
    background:#0b67a3;
    color:#fff;
    padding:10px 20px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:800;
    font-size:13px;
    box-shadow:0 6px rgba(0,0,0,0.18);
  }

  .totalTop{
    background: linear-gradient(#6b0202,#d71c1c);
    color:#fff;
    padding:10px 15px;
    border-radius:12px;
    font-weight:800;
    font-size:17px;
    box-shadow:0 6px rgba(0,0,0,0.12);
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }

  .fileRow{display:none;margin-left:8px}

  table{width:100%;border-collapse:collapse;margin-top:36px;}
  th,td{padding:10px;border:1px solid #ddd;text-align:left;}
  th{background:#f3f0f0}
    .msg{
    color:#a33;
    margin-top:10px;
    font-size:14px;
  }
  .msg .overall-strong{
    font-weight:900;
    color:#8b0000;      /* darker red */
  }
  
.exit-bottom{
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: linear-gradient(#8b0000, #4a0000);
  color: #fff;
  font-weight: 900;
  padding: 12px 22px;
  border-radius: 14px;
  box-shadow: 0 6px rgba(0,0,0,0.4);
  text-decoration: none;
  font-size: 15px;
  z-index: 9999;
  transition: 0.2s ease;
}

.exit-bottom:hover{
  background: linear-gradient(#4a0000, #000);
  transform: scale(1.08);
}


  @media (max-width:1100px){
    .controls{flex-wrap:wrap;}
    .totalTop{margin-top:10px;}
  }

</style>

</head>
<body>

<div class="header">
  REPORT
  <div class="logo"><img src="{{ url_for('static', filename='fabvi_logo.png') }}" alt="logo"></div>
</div>

<div class="wrap">

  <!-- TOP CONTROLS -->
  <div class="controls">

      <div class="pill">
        <label>START DATE</label>
        <input id="start" type="date" aria-label="start date">
      </div>

      <div class="pill">
        <label>END DATE</label>
        <input id="end" type="date" aria-label="end date">
      </div>

      <div class="pill" id="machine">
        <label>Machine No</label>
        <select id="machineSelect" aria-label="machine" onchange="onMachineChange()">
          {% for m in machines %}
          <option value="{{ m.machine_no }}"
            {% if m.machine_no|string == selected_machine|string %}selected{% endif %}>
            {{ m.machine_no }}
          </option>
          {% endfor %}
          <option value="ALL" {% if selected_machine == 'ALL' %}selected{% endif %}>
            OverAll
          </option>
        </select>
      </div>

      <button id="submitBtn" class="submit">SUBMIT</button>

      <div class="totalTop">TOTAL ROLLS: <span id="totalValue">-</span></div>

      <button id="downloadBtn" class="download">DOWNLOAD PDF</button>

      <!-- hidden file input (fallback only) -->
      <div id="fileBox" class="fileRow">
        <label style="font-weight:800;margin-right:8px">Load file:</label>
        <input id="fileInput" type="file" accept=".txt,.csv,.json">
      </div>

  </div>

  <div id="status" class="msg" aria-live="polite"></div>

  <table>
    <thead>
      <!-- we will replace this header dynamically in JS depending on mode -->
      <tr id="theadRow">
        <th>S.No</th><th>Start Date</th><th>End Date</th><th>Machine</th><th>Roll</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
/* Globals */
let DATA = null;
let LAST_MATCHED = [];
const responseData = {{ content | tojson }};

/* Try to load from Flask JSON first */
async function tryFetch() {
  const statusEl = document.getElementById('status');
  try {
    const mp = responseData.machine_performence || responseData.machine_performance || responseData;
    const json = mp.start_timing_table || [];
    DATA = json.map(normalizeRow);

    statusEl.textContent = 'Loaded database (' + DATA.length + ' rows)';
    populateDefaultRange();
  } catch (err) {
    console.warn('load from Flask failed:', err);
    const box = document.getElementById('fileBox');
    if(box) box.style.display = 'inline-block';
    statusEl.textContent = 'Could not fetch database. Please use file picker.';
  }
}
tryFetch();

/* File picker: attach listener only if element exists */
const fileInputEl = document.getElementById('fileInput');
if(fileInputEl){
  fileInputEl.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = String(ev.target.result);
      if(f.name.toLowerCase().endsWith('.json')){
        try{
          const j = JSON.parse(text);
          if(Array.isArray(j)){
            DATA = j.map(normalizeRow);
            document.getElementById('status').textContent = 'Loaded JSON file (' + DATA.length + ' rows)';
            populateDefaultRange();
            return;
          }
        }catch(err){ alert('Invalid JSON file'); }
      }
      DATA = parse(text);
      document.getElementById('status').textContent = 'Loaded file (' + DATA.length + ' rows)';
      populateDefaultRange();
    };
    reader.readAsText(f, 'utf-8');
  });
}

/* Normalize potential JSON rows to expected shape */
function normalizeRow(r){
  return {
    sno: r.id ?? r.sno ?? r.Sno ?? r.SNo ?? '',
    start: r.start_time ?? r.start ?? r.start_date ?? r.startDate ?? r.Start ?? '',
    end:  r.end_time ?? r.end ?? r.end_date ?? r.endDate ?? r.End ?? '',
    machine: String(r.machine_number ?? r.machine ?? r.Machine ?? r.machine_no ?? ''),
    roll: Number(r.roll_id ?? r.roll ?? r.Roll ?? r.rolls ?? 0)
  };
}

/* Parse csv or space-aligned text (fallback) */
function parse(text){
  const lines = text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length === 0) return [];
  if(lines[0].includes(',')){
    const out = [];
    let startI = 0;
    if(/sno|start|end/i.test(lines[0])) startI = 1;
    for(let i=startI;i<lines.length;i++){
      const cols = lines[i].split(',').map(c=>c.trim());
      if(cols.length < 5) continue;
      out.push({sno: cols[0], start: cols[1], end: cols[2], machine: cols[3], roll: Number(cols[4])});
    }
    return out.map(normalizeRow);
  } else {
    const out = [];
    let startLine = 0;
    if(/sno/i.test(lines[0]) && /start/i.test(lines[0])) startLine = 1;
    for(let i=startLine; i<lines.length; i++){
      const cols = lines[i].split(/\s{2,}/).map(c=>c.trim()).filter(Boolean);
      if(cols.length >= 5){
        out.push({sno: cols[0], start: cols[1], end: cols[2], machine: cols[3], roll: Number(cols[4])});
      } else {
        const parts = lines[i].split(/\s+/);
        if(parts.length >= 7){
          const sno = parts[0];
          const start = parts[1] + ' ' + parts[2];
          const end = parts[3] + ' ' + parts[4];
          const machine = parts[5];
          const roll = parts[6];
          out.push({sno, start, end, machine, roll: Number(roll)});
        }
      }
    }
    return out.map(normalizeRow);
  }
}

/* Set default start/end based on DATA (use local date, not UTC) */
function populateDefaultRange(){
  if(!DATA || !DATA.length) return;
  const dates = DATA.map(r=>parseDateLocal(r.start)).filter(Boolean);
  if(!dates.length) return;
  const min = new Date(Math.min(...dates.map(d=>d.getTime())));
  const max = new Date(Math.max(...dates.map(d=>d.getTime())));

  const fmtLocal = dt => {
    const y = dt.getFullYear();
    const m = String(dt.getMonth()+1).padStart(2,'0');
    const d = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  };

  const sEl = document.getElementById('start');
  const eEl = document.getElementById('end');
  if(sEl) sEl.value = fmtLocal(min);
  if(eEl) eEl.value = fmtLocal(max);
}

/* Submit -> filter by date */
document.getElementById('submitBtn').addEventListener('click', ()=>{
  try {
    if(!DATA){ alert('No data loaded'); return; }
    const sd = document.getElementById('start').value;
    const ed = document.getElementById('end').value;
    if(!sd || !ed){ alert('Select both start and end dates'); return; }
    const s = new Date(sd + ' 00:00:00');
    const e = new Date(ed + ' 23:59:59');

    const matched = DATA.filter(r => {
      const d = parseDateLocal(r.start);
      return d && d >= s && d <= e;
    });

    LAST_MATCHED = matched;
    renderTable(matched);
  } catch (err) {
    console.error('Error in submit handler:', err);
    alert('An error occurred—check browser console for details.');
  }
});

/* render table
   - Single machine -> detail table (Start/End/Machine/Roll)
   - Overall (ALL)  -> summary table (S.No/Machine No/Roll Count) only
*/
function renderTable(rows){
  const tbody = document.getElementById('tbody');
  const theadRow = document.getElementById('theadRow');
  tbody.innerHTML = '';

  const selected = document.getElementById('machineSelect').value;

  if(selected === 'ALL'){
    // --- OVERALL MODE: show summary only ---
    // machine-wise roll counts based on filtered rows
    const counts = {};
    rows.forEach(r=>{
      const m = r.machine || 'Unknown';
      counts[m] = (counts[m] || 0) + 1;
    });

    const machines = Object.keys(counts).sort((a,b)=>Number(a)-Number(b));
    const overall = machines.reduce((sum,m)=>sum + (counts[m]||0), 0);

    // change header
    theadRow.innerHTML = '<th>S.No</th><th>Machine No</th><th>Roll Count</th>';

    machines.forEach((m, idx)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${idx+1}</td><td>${m}</td><td>${counts[m]}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('totalValue').textContent = overall;
    document.getElementById('status').innerHTML =
   `Matched ${rows.length} rows across ${machines.length} machines. 
   <span class="overall-strong">Overall Roll Count: ${overall}</span>`;

  } else {
    // --- SINGLE MACHINE MODE: detail table as before ---
    const totalCount = rows.length;

    theadRow.innerHTML = '<th>S.No</th><th>Start Date</th><th>End Date</th><th>Machine</th><th>Roll</th>';

  rows.forEach((r, idx) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${r.sno}</td>
                  <td>${r.start}</td>
                  <td>${r.end}</td>
                  <td>${r.machine}</td>
                  <td>${r.roll}</td>`;   // ✅ show real roll_id (3,4,…)
  tbody.appendChild(tr);
});

    document.getElementById('totalValue').textContent = totalCount;
    document.getElementById('status').textContent = `Matched ${rows.length} rows`;
  }
}

/* parse date: support yyyy-mm-dd hh:mm:ss and dd-mm-yyyy hh:mm:ss */
function parseDateLocal(s){
  if(!s) return null;
  s = s.trim();
  const dm = s.match(/^(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{2}:\d{2}:\d{2}))?$/);
  if(dm){
    const [,d,m,y,time] = dm;
    const parts = (time || '00:00:00').split(':');
    return new Date(Number(y), Number(m)-1, Number(d), Number(parts[0]), Number(parts[1]), Number(parts[2]));
  }
  const ym = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}):(\d{2}))?$/);
  if(ym){
    const [,Y,Mo,D,H='0',Mi='0',S='0'] = ym;
    return new Date(Number(Y), Number(Mo)-1, Number(D), Number(H), Number(Mi), Number(S));
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* machine dropdown -> reload /report?machine_no=X (or ALL) */
function onMachineChange(){
  const m = document.getElementById('machineSelect').value;
  const url = new URL(window.location.href);
  if(m) url.searchParams.set('machine_no', m);
  else  url.searchParams.delete('machine_no');
  window.location.href = url.toString();
}

/* PDF download: different format for single machine vs ALL */
document.getElementById('downloadBtn').addEventListener('click', () => {
  if(!LAST_MATCHED || LAST_MATCHED.length === 0){
    alert('No filtered rows to export. Click SUBMIT first.');
    return;
  }
  const selected = document.getElementById('machineSelect').value;
  if(selected === 'ALL'){
    downloadOverallPDF();
  } else {
    downloadMachinePDF();
  }
});

/* PDF for a single machine -> detailed rows (old behaviour) */
function downloadMachinePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });

  doc.setFontSize(18);
  doc.setFont('helvetica','bold');
  doc.text('REPORT', 40, 50);

  const sd = document.getElementById('start').value;
  const ed = document.getElementById('end').value;
  doc.setFontSize(11);
  doc.setFont('helvetica','normal');
  doc.text(`From: ${sd}    To: ${ed}`, 40, 72);

  const totalCount = LAST_MATCHED.length;
  doc.setFont('helvetica','bold');
  doc.text(`Total Roll: ${totalCount}`, 40, 92);

  const head = [['S.No','Start Date','End Date','Machine','Roll']];
  const body = LAST_MATCHED.map((r, idx) => [
  String(r.sno),
  String(r.start),
  String(r.end),
  String(r.machine),
  String(r.roll)           // ✅ use real roll_id
]);

  doc.autoTable({
    head: head,
    body: body,
    startY: 110,
    styles: { font: 'helvetica', fontSize: 9 },
    headStyles: { fillColor: [220,220,220], halign: 'center' },
    alternateRowStyles: { fillColor: [245,245,245] },
    margin: { left: 40, right: 40 },
    didDrawPage: function (data) {
      const pageNumber = doc.internal.getNumberOfPages();
      doc.setFontSize(9);
      doc.setTextColor(100);
      doc.text('Page ' + pageNumber, data.settings.margin.left, doc.internal.pageSize.height - 10);
    },
    columnStyles: {
      0: { cellWidth: 40 },
      1: { cellWidth: 140 },
      2: { cellWidth: 140 },
      3: { cellWidth: 60 },
      4: { cellWidth: 50, halign: 'right' }
    }
  });

  const fname = `report_${sd}_to_${ed}.pdf`.replace(/:/g,'-');
  doc.save(fname);
}

function downloadOverallPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });

  const sd = document.getElementById('start').value;
  const ed = document.getElementById('end').value;

  const pageWidth = doc.internal.pageSize.getWidth();

  // ----- TITLE -----
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.text('OVERALL REPORT', pageWidth / 2, 50, { align: 'center' });

  // underline title
  doc.setDrawColor(180,180,180);
  doc.line(40, 60, pageWidth - 40, 60);

  // ----- RANGE -----
  doc.setFontSize(12);
  doc.setFont('helvetica','normal');
  doc.text(`From: ${sd}`, 40, 80);
  doc.text(`To:   ${ed}`, 200, 80);

  /* build machine-wise roll counts */
  const counts = {};
  LAST_MATCHED.forEach(r=>{
    const m = r.machine || 'Unknown';
    counts[m] = (counts[m] || 0) + 1;
  });

  const machines = Object.keys(counts).sort((a,b)=>Number(a)-Number(b));
  const overall = machines.reduce((sum,m)=>sum + (counts[m]||0), 0);

  // ----- OVERALL TOTAL (bold & dark) -----
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.setTextColor(40,0,0);   // dark reddish
  doc.text(`Overall machine roll count: ${overall}`, 40, 105);

  // reset text color for table
  doc.setTextColor(0,0,0);

  /* table: machine no & roll count */
  const head = [['Machine No', 'Roll Count']];
  const body = machines.map(m => [
    `Machine No : ${m}`, String(counts[m])
  ]);

  doc.autoTable({
    head: head,
    body: body,
    startY: 125,
    styles: { font: 'helvetica', fontSize: 11 },
    headStyles: {
      fillColor: [122,36,36],   // dark maroon header
      textColor: 255,
      halign: 'center'
    },
    alternateRowStyles: { fillColor: [245,245,245] },
    margin: { left: 40, right: 40 },
    didDrawPage: function (data) {
      const pageNumber = doc.internal.getNumberOfPages();
      doc.setFontSize(9);
      doc.setTextColor(100);
      doc.text('Page ' + pageNumber,
               data.settings.margin.left,
               doc.internal.pageSize.height - 10);
    },
    columnStyles: {
      0: { cellWidth: 260 },
      1: { cellWidth: 80, halign: 'right' }
    }
  });

  const fname = `overall_report_${sd}_to_${ed}.pdf`.replace(/:/g,'-');
  doc.save(fname);
}

</script>
<a href="{{ url_for('index') }}" class="exit-bottom">EXIT</a>
</body>
</html>
